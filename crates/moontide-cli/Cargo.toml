[package]
name = "moontide-cli"
description = "MoonTide Rust CLI"
version.workspace = true
edition.workspace = true
authors.workspace = true

[[bin]]
name = "moontide"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true, features = ["derive", "env"] }
dotenvy = { workspace = true }
moontide-agent = { workspace = true }
moontide-llm = { workspace = true }
moontide-observability = { workspace = true }
moontide-session = { workspace = true }
moontide-tools = { workspace = true }
rustyline = { workspace = true }
tokio = { workspace = true }
