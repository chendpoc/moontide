[workspace]
resolver = "2"
members = [
    "crates/ocula-protocol",
    "crates/ocula-session",
    "crates/ocula-composer",
    "crates/ocula-llm",
    "crates/ocula-tools",
    "crates/ocula-observability",
    "crates/ocula-agent",
    "crates/ocula-cli",
    "ui",
]

[workspace.package]
edition = "2021"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
dotenvy = "0.15"
glob = "0.3"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rustyline = "15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
owo-colors = "4.3"

ocula-protocol = { path = "crates/ocula-protocol" }
ocula-session = { path = "crates/ocula-session" }
ocula-composer = { path = "crates/ocula-composer" }
ocula-llm = { path = "crates/ocula-llm" }
ocula-tools = { path = "crates/ocula-tools" }
ocula-observability = { path = "crates/ocula-observability" }
ocula-agent = { path = "crates/ocula-agent" }
