[workspace]
resolver = "2"
members = [
    "crates/moontide-protocol",
    "crates/moontide-session",
    "crates/moontide-composer",
    "crates/moontide-llm",
    "crates/moontide-tools",
    "crates/moontide-observability",
    "crates/moontide-agent",
    "crates/moontide-cli",
    "crates/moontide-ui",
]

[workspace.package]
edition = "2021"
version = "0.1.0"
authors = ["OceanSpark"]

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
dotenvy = "0.15"
glob = "0.3"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rustyline = "15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
owo-colors = "4.3"

moontide-protocol = { path = "crates/moontide-protocol" }
moontide-session = { path = "crates/moontide-session" }
moontide-composer = { path = "crates/moontide-composer" }
moontide-llm = { path = "crates/moontide-llm" }
moontide-tools = { path = "crates/moontide-tools" }
moontide-observability = { path = "crates/moontide-observability" }
moontide-agent = { path = "crates/moontide-agent" }
