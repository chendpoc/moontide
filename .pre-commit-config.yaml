# Git hooks via https://pre-commit.com
# Setup (once per clone):
#   brew install pre-commit          # or: pip install pre-commit
#   rustup toolchain install nightly -c rustfmt --profile minimal
#   pre-commit install
#   pre-commit install --hook-type pre-push
#
# `rust-toolchain.toml` installs stable + clippy on cd; nightly rustfmt is separate (see above).
# Manual: pre-commit run --all-files | just pre-commit | just check

default_language_version:
  python: python3

repos:
  - repo: local
    hooks:
      - id: rustfmt-nightly
        name: rustfmt (nightly, check)
        entry: cargo +nightly fmt --all --check
        language: system
        pass_filenames: false
        always_run: true

      - id: clippy
        name: clippy (workspace, -D warnings)
        entry: cargo clippy --workspace --all-targets -- -D warnings
        language: system
        pass_filenames: false
        always_run: true

      - id: just-pre-push
        name: just pre-push (workspace test)
        entry: just pre-push
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
