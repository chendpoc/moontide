# Git hooks via https://pre-commit.com
# Setup (once per clone):
#   brew install pre-commit          # or: pip install pre-commit
#   rustup component add rustfmt clippy
#   pre-commit install
#   pre-commit install --hook-type pre-push
#
# Manual: pre-commit run --all-files | just pre-commit | just check

default_language_version:
  python: python3

repos:
  - repo: local
    hooks:
      - id: just-pre-commit
        name: just pre-commit (fmt + clippy)
        entry: just pre-commit
        language: system
        pass_filenames: false
        always_run: true

      - id: just-pre-push
        name: just pre-push (workspace test)
        entry: just pre-push
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
