name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test MoonTide Rust crates
        run: cargo test -p moontide-protocol -p moontide-session -p moontide-composer -p moontide-tools -p moontide-llm -p moontide-agent -p moontide-cli
