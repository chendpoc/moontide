name: eval-optional

on:
  pull_request:
    types: [labeled, synchronize, reopened]
  workflow_dispatch:
    inputs:
      feature_surface:
        description: Feature surface for eval:feature
        required: true
        default: deep_protocol
        type: choice
        options:
          - deep_protocol
          - tooling
          - context
          - prompt
          - model_only
      max_cases:
        description: Max cases per suite (cost control)
        required: false
        default: "5"

jobs:
  eval-l2:
    if: |
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'eval:run')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Run L2 feature eval
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          SURFACE="${{ github.event_name == 'workflow_dispatch' && inputs.feature_surface || 'deep_protocol' }}"
          MAX="${{ github.event_name == 'workflow_dispatch' && inputs.max_cases || '5' }}"
          pnpm eval:feature -- \
            --feature-surface="$SURFACE" \
            --max-cases="$MAX" \
            --agent-concurrency=2 \
            --repetitions=1 \
            --no-write-impact
        continue-on-error: true
        id: eval

      - name: Upload eval artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-runs
          path: packages/evals/runs/
          if-no-files-found: ignore

      - name: Fail job if merge-gate failed
        if: steps.eval.outcome == 'failure'
        run: exit 1
