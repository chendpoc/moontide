# Applies to Cargo workspace Rust sources (crates/* via `just fmt`); not scripts/ or frontend.
edition = "2024"
style_edition = "2024"
# LF in VCS; cross-platform checkouts stay consistent
newline_style = "Unix"

# One item per line inside `use foo::{ ... }` when the block wraps (nightly rustfmt).
# just check / CI use `cargo +nightly fmt`; stable ignores this key.
imports_layout = "Vertical"
